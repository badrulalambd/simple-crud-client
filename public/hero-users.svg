<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- decorative background blobs -->
  <circle cx="480" cy="70" r="95" fill="url(#blob)"/>
  <circle cx="80" cy="360" r="75" fill="url(#blob)"/>

  <!-- app window -->
  <g filter="url(#shadow)">
    <rect x="60" y="50" width="440" height="320" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
  </g>

  <!-- title bar -->
  <circle cx="84" cy="74" r="5" fill="#f87171"/>
  <circle cx="102" cy="74" r="5" fill="#fbbf24"/>
  <circle cx="120" cy="74" r="5" fill="#34d399"/>
  <rect x="150" y="67" width="200" height="14" rx="7" fill="#f4f4f5"/>
  <line x1="60" y1="98" x2="500" y2="98" stroke="#e4e4e7"/>

  <!-- section header: title + add button -->
  <rect x="84" y="112" width="90" height="12" rx="6" fill="#a1a1aa"/>
  <rect x="400" y="104" width="76" height="28" rx="8" fill="#6366f1"/>
  <path d="M438 112v12M432 118h12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- user row 1 -->
  <circle cx="100" cy="160" r="16" fill="#c7d2fe"/>
  <rect x="130" y="148" width="130" height="10" rx="5" fill="#d4d4d8"/>
  <rect x="130" y="164" width="90" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="420" y="146" width="28" height="28" rx="8" fill="#eff6ff"/>
  <path d="M428 166l1-3 8-8 2 2-8 8-3 1z" fill="#3b82f6"/>
  <rect x="456" y="146" width="28" height="28" rx="8" fill="#fef2f2"/>
  <path d="M464 155h12M466 155l1 9h6l1-9M468 153h4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- user row 2 -->
  <circle cx="100" cy="215" r="16" fill="#bbf7d0"/>
  <rect x="130" y="203" width="110" height="10" rx="5" fill="#d4d4d8"/>
  <rect x="130" y="219" width="80" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="420" y="201" width="28" height="28" rx="8" fill="#eff6ff"/>
  <path d="M428 221l1-3 8-8 2 2-8 8-3 1z" fill="#3b82f6"/>
  <rect x="456" y="201" width="28" height="28" rx="8" fill="#fef2f2"/>
  <path d="M464 210h12M466 210l1 9h6l1-9M468 208h4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- user row 3 -->
  <circle cx="100" cy="270" r="16" fill="#fde68a"/>
  <rect x="130" y="258" width="140" height="10" rx="5" fill="#d4d4d8"/>
  <rect x="130" y="274" width="95" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="420" y="256" width="28" height="28" rx="8" fill="#eff6ff"/>
  <path d="M428 276l1-3 8-8 2 2-8 8-3 1z" fill="#3b82f6"/>
  <rect x="456" y="256" width="28" height="28" rx="8" fill="#fef2f2"/>
  <path d="M464 265h12M466 265l1 9h6l1-9M468 263h4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- user row 4 -->
  <circle cx="100" cy="325" r="16" fill="#fbcfe8"/>
  <rect x="130" y="313" width="120" height="10" rx="5" fill="#d4d4d8"/>
  <rect x="130" y="329" width="85" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="420" y="311" width="28" height="28" rx="8" fill="#eff6ff"/>
  <path d="M428 331l1-3 8-8 2 2-8 8-3 1z" fill="#3b82f6"/>
  <rect x="456" y="311" width="28" height="28" rx="8" fill="#fef2f2"/>
  <path d="M464 320h12M466 320l1 9h6l1-9M468 318h4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating badges -->
  <g filter="url(#shadow-sm)">
    <circle cx="500" cy="336" r="26" fill="#10b981"/>
  </g>
  <path d="M491 336l6 6 12-13" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow-sm)">
    <circle cx="56" cy="112" r="22" fill="#6366f1"/>
  </g>
  <path d="M56 103v18M47 112h18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
